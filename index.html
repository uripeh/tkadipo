<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web TKA - SMP Diponegoro Sampang</title>
    
    <!-- Favicon Kustom Berbasis SVG dengan Tulisan "URIP" -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='30' fill='%231e40af'/><text x='50%25' y='62%25' font-family='Poppins, Arial, sans-serif' font-weight='800' font-size='32' fill='%23ffffff' text-anchor='middle'>URIP</text></svg>">
    
    <!-- Tailwind CSS v4 Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0e8f5, #b8cbe4);
            min-height: 100vh;
        }
        /* Efek Tombol & Kartu 3D Pop-Out (Neumorphism Soft UI) */
        .card-3d {
            background: #e0e8f5;
            border-radius: 20px;
            box-shadow: 9px 9px 16px #becadc, -9px -9px 16px #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .input-3d {
            background: #e0e8f5;
            border-radius: 12px;
            box-shadow: inset 5px 5px 10px #becadc, inset -5px -5px 10px #ffffff;
            transition: all 0.3s ease;
        }
        .btn-3d {
            background: linear-gradient(145deg, #3b82f6, #1d4ed8);
            box-shadow: 5px 5px 10px #becadc, -5px -5px 10px #ffffff;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-3d:active {
            transform: scale(0.95);
            box-shadow: inset 2px 2px 5px #1d4ed8;
        }
        .btn-secondary-3d {
            background: linear-gradient(145deg, #10b981, #047857);
            box-shadow: 5px 5px 10px #becadc, -5px -5px 10px #ffffff;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-secondary-3d:active {
            transform: scale(0.95);
            box-shadow: inset 2px 2px 5px #047857;
        }
        .btn-warning-3d {
            background: linear-gradient(145deg, #f59e0b, #d97706);
            box-shadow: 5px 5px 10px #becadc, -5px -5px 10px #ffffff;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-warning-3d:active {
            transform: scale(0.95);
            box-shadow: inset 2px 2px 5px #d97706;
        }
        /* Loading Spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center justify-center relative">

    <div class="w-full max-w-md mx-auto my-auto py-6">
        
        <!-- Header Madrasah -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-extrabold text-blue-900 drop-shadow-sm">SMP DIPONEGORO SAMPANG</h1>
            <p class="text-sm font-semibold text-blue-600 tracking-wider">APLIKASI TKA & SHTKA</p>
        </div>

        <!-- Halaman Login -->
        <div id="page-login" class="card-3d p-6 space-y-5">
            <div class="text-center">
                <span class="text-4xl">🔐</span>
                <h3 class="text-lg font-bold text-gray-700 mt-2">Login Siswa</h3>
                <p class="text-xs text-gray-500">Masukkan 4 digit nomor induk siswa (NIS)</p>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">Masukkan NIS</label>
                <div class="relative">
                    <input type="text" 
                           inputmode="numeric" 
                           pattern="[0-9]*" 
                           maxlength="4" 
                           id="login-nis" 
                           oninput="handleNisInput(this)" 
                           class="w-full p-4 input-3d text-gray-700 font-bold text-lg tracking-widest text-center focus:outline-none" 
                           placeholder="Contoh: 1002">
                    <div id="login-loader" class="absolute right-4 top-4.5 hidden"><div class="loader"></div></div>
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">Nama Peserta</label>
                <input type="text" 
                       id="login-nama" 
                       class="w-full p-4 input-3d text-gray-500 font-bold text-center bg-gray-200/50 cursor-not-allowed focus:outline-none" 
                       placeholder="Nama akan muncul otomatis..." 
                       readonly>
            </div>
            
            <button onclick="handleLoginSuccess()" 
                    id="btn-submit-login" 
                    class="w-full py-4 text-white font-bold rounded-xl btn-3d mt-2 opacity-50 cursor-not-allowed transition-all duration-300" 
                    disabled>
                Masuk ke Sistem
            </button>
        </div>

        <!-- Halaman Profil Siswa -->
        <div id="page-search" class="card-3d p-6 space-y-5 hidden">
            <h3 class="text-lg font-bold text-gray-700 text-center mb-2">👤 Profil Anda</h3>
            <p class="text-lg font-semibold text-blue-600 text-center tracking-wider">Cek profil & Informasi Diri Anda</p>

            <div class="flex gap-2">
                <input type="text" 
                       id="search-nis" 
                       class="w-full p-4 input-3d text-red-500 font-bold text-center bg-gray-200/50 cursor-not-allowed focus:outline-none" 
                       readonly>
            </div>

            <div id="result-container" class="hidden space-y-4">
                <div class="overflow-x-auto rounded-xl shadow-inner bg-white/50 p-2">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="border-b border-gray-300 text-gray-500 font-bold">
                                <th class="p-2">Biodata</th>
                                <th class="p-2">Informasi Siswa</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="text-gray-700 font-medium">
                            <!-- Baris tabel akan diisi secara dinamis melalui JavaScript -->
                        </tbody>
                    </table>
                </div>

                <!-- Tombol Aksi TKA, Cetak TKA, & Cetak SHTKA Sebaris -->
                <div class="grid grid-cols-3 gap-2 pt-2">
                    <button id="btn-lihat-tka" onclick="actionTKA()" class="py-3 text-white font-bold rounded-xl btn-3d text-center text-[11px] cursor-pointer">
                        📄 Lihat TKA
                    </button>
                    <button id="btn-cetak-tka" onclick="actionCetakTKA()" class="py-3 text-white font-bold rounded-xl btn-warning-3d text-center text-[11px] cursor-pointer">
                        🖨️ Cetak TKA
                    </button>
                    <button id="btn-cetak-shtka" onclick="actionSHTKA()" class="py-3 text-white font-bold rounded-xl btn-secondary-3d text-center text-[11px] cursor-pointer">
                        🎓 Cetak SHTKA
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Sistem Modal Custom / Dialog Box -->
    <div id="custom-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
        <div class="card-3d p-6 max-w-sm w-full space-y-4 text-center transform scale-95 transition-transform duration-300" id="modal-box">
            <div class="mx-auto w-16 h-16 flex items-center justify-center rounded-full bg-blue-100 text-blue-600 text-3xl shadow-inner" id="modal-icon">
                🔔
            </div>
            <h4 class="text-xl font-bold text-gray-800" id="modal-title">Pemberitahuan</h4>
            <div class="text-sm text-gray-600 font-medium text-left px-2" id="modal-message">Pesan notifikasi di sini.</div>
            <button onclick="closeModal()" class="w-full py-3 text-white font-bold rounded-xl btn-3d cursor-pointer">
                Mengerti
            </button>
        </div>
    </div>

    <script>
        // Tautan API Google Apps Script
        const API_URL = "https://script.google.com/macros/s/AKfycbx7vIEKoutbRPyDO7qHBXhhVXS3UQJHchWgsGJJ_Lt6hBO9NswgpHNZKrPm9c958Au2/exec";
        let globalDataSiswa = null; 
        let lastQueryNis = ""; 
        let timerPencarian; 

        // --- FUNGSI PEMBANTU HURUF BESAR DI AWAL KATA (TITLE CASE) ---
        function toTitleCase(str) {
            if (!str) return "-";
            return str.toLowerCase().replace(/\b[a-z]/g, function(letter) {
                return letter.toUpperCase();
            });
        }

        // --- FUNGSI PEMBANTU FORMAT TANGGAL INDONESIA ---
        function getFormattedDateIndo() {
            const bulanList = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            const hariIni = new Date();
            const tanggal = hariIni.getDate();
            const bulan = bulanList[hariIni.getMonth()];
            const tahun = hariIni.getFullYear();
            return `${tanggal} ${bulan} ${tahun}`;
        }

        // --- SISTEM MODAL KUSTOM ---
        function showNotification(title, message, emoji = '🔔') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerHTML = message;
            document.getElementById('modal-icon').innerText = emoji;
            
            const modal = document.getElementById('custom-modal');
            const modalBox = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalBox.classList.remove('scale-95');
                modalBox.classList.add('scale-100');
            }, 50);
        }

        // --- MENUTUP MODAL CUSTOM ---
        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const modalBox = document.getElementById('modal-box');
            
            modalBox.classList.remove('scale-100');
            modalBox.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 150);

            const nameInput = document.getElementById('login-nama');
            if (nameInput && nameInput.value === "") {
                const nisInput = document.getElementById('login-nis');
                if (nisInput) {
                    nisInput.value = "";
                }
                resetLoginState();
            }
        }

        // --- LIMITASI INPUT NIS (MAKSIMAL & WAJIB 4 DIGIT ANGKA) ---
        function handleNisInput(input) {
            let val = input.value.replace(/[^0-9]/g, ''); // Ambil angka saja
            if (val.length > 4) {
                val = val.slice(0, 4); // Batasi maksimal 4 digit
            }
            input.value = val;
            
            if (val.length === 4) { 
                autoFindName(val); // Cari otomatis jika pas 4 digit
            } else { 
                resetLoginState(); 
            }
        }

        // --- RESET STATUS TOMBOL & KOLOM NAMA ---
        function resetLoginState() {
            const nameInput = document.getElementById('login-nama');
            const btnSubmit = document.getElementById('btn-submit-login');
            
            nameInput.value = "";
            nameInput.placeholder = "Nama akan muncul otomatis...";
            btnSubmit.disabled = true;
            btnSubmit.className = "w-full py-4 text-white font-bold rounded-xl btn-3d mt-2 opacity-50 cursor-not-allowed transition-all duration-300";
            lastQueryNis = "";
            globalDataSiswa = null;
        }

        // --- AMBIL DATA SISWA MENGGUNAKAN METODE JSONP (SOLUSI MUTLAK CORS DI SANDBOX) ---
        function fetchSiswaJSONP(nis) {
            return new Promise((resolve, reject) => {
                const callbackName = "tkaCallback_" + Math.round(100000 * Math.random());
                const timeoutId = setTimeout(() => {
                    cleanup();
                    reject(new Error("Timeout"));
                }, 10000);

                window[callbackName] = function(data) {
                    cleanup();
                    resolve(data);
                };

                const script = document.createElement("script");
                script.id = callbackName;
                script.src = `${API_URL}?nis=${encodeURIComponent(nis)}&callback=${callbackName}`;
                script.onerror = function() {
                    cleanup();
                    reject(new Error("Error Load"));
                };

                document.body.appendChild(script);

                function cleanup() {
                    clearTimeout(timeoutId);
                    const el = document.getElementById(callbackName);
                    if (el) {
                        el.parentNode.removeChild(el);
                    }
                    delete window[callbackName];
                }
            });
        }

        // --- AUTO-FILL NAMA SISWA SAAT LOGIN NIS PAS MINIMAL 4 DIGIT ---
        function autoFindName(nis) {
            if (nis === lastQueryNis) return;
            clearTimeout(timerPencarian);
            timerPencarian = setTimeout(async () => {
                lastQueryNis = nis;
                document.getElementById('login-loader').classList.remove('hidden');
                
                try {
                    const result = await fetchSiswaJSONP(nis);
                    if (result && result.NamaPeserta && !result.error) { 
                        // Memastikan Nama Peserta menggunakan huruf besar di awal kata
                        const formattedName = toTitleCase(result.NamaPeserta);
                        document.getElementById('login-nama').value = formattedName;
                        
                        const btn = document.getElementById('btn-submit-login');
                        btn.disabled = false;
                        btn.className = "w-full py-4 text-white font-bold rounded-xl btn-3d mt-2 opacity-100 cursor-pointer";
                        globalDataSiswa = result;
                        
                        // NOTIFIKASI BERHASIL DITEMUKAN
                        showNotification(
                            "NIS ada dalam database TKA!", 
                            `Data siswa berhasil diverifikasi!<br>Atas Nama: <b class="text-blue-900">${formattedName}</b>`, 
                            "✅"
                        );
                    } else {
                        resetLoginState();
                        document.getElementById('login-nama').placeholder = "NIS tidak ditemukan!";
                        
                        // NOTIFIKASI GAGAL / TIDAK DITEMUKAN
                        showNotification(
                            "NIS Tidak Terdaftar", 
                            "Maaf, Nomor Induk Siswa (NIS) yang Anda masukkan tidak ditemukan dalam basis data sistem.", 
                            "⚠️"
                        );
                    }
                } catch (e) { 
                    resetLoginState(); 
                    showNotification(
                        "Kesalahan Koneksi", 
                        "Gagal menghubungi server basis data. Harap periksa koneksi internet Anda.", 
                        "❌"
                    );
                } finally { 
                    document.getElementById('login-loader').classList.add('hidden'); 
                }
            }, 400);
        }

        // --- PROSES TRANSISI MASUK KE SISTEM PROFIL ---
        function handleLoginSuccess() {
            document.getElementById('page-login').classList.add('hidden');
            document.getElementById('page-search').classList.remove('hidden');
            
            // Menggunakan data NIS (Kolom B) dari respons backend sebagai NIS default pada tampilan
            document.getElementById('search-nis').value = globalDataSiswa.NoIndukNIS;
            
            const formatNama = toTitleCase(globalDataSiswa.NamaPeserta);
            const formatOrtu = toTitleCase(globalDataSiswa.NamaOrangTua);
            const formatTTL = toTitleCase(globalDataSiswa.TempatTanggalLahir);
            
            // Tampilan data profil disesuaikan secara detail dan presisi dengan klasifikasi NIS (B) & NISN (C)
            document.getElementById('table-body').innerHTML = `
                <tr class="border-b border-gray-100"><td class="p-2 text-gray-400">NIS</td><td class="p-2 font-semibold text-gray-800">${globalDataSiswa.NoIndukNIS || '-'}</td></tr>
                <tr class="border-b border-gray-100"><td class="p-2 text-gray-400">NISN</td><td class="p-2 font-semibold text-gray-800">${globalDataSiswa.NoIndukNISN || '-'}</td></tr>
                <tr class="border-b border-gray-100"><td class="p-2 text-gray-400">Nama Peserta</td><td class="p-2 font-semibold text-gray-800">${formatNama}</td></tr>
                <tr class="border-b border-gray-100"><td class="p-2 text-gray-400">No. Peserta TKA</td><td class="p-2 font-semibold text-gray-800">${globalDataSiswa.NoPesertaTKA || '-'}</td></tr>
                <tr class="border-b border-gray-100"><td class="p-2 text-gray-400">Jenis Kelamin</td><td class="p-2 font-semibold text-gray-800">${globalDataSiswa.JK || '-'}</td></tr>
                <tr class="border-b border-gray-100"><td class="p-2 text-gray-400">Nama OrTu</td><td class="p-2 font-semibold text-gray-800">${formatOrtu}</td></tr>
                <tr class="border-b border-gray-100"><td class="p-2 text-gray-400">Tmpt Tggl Lahir</td><td class="p-2 font-semibold text-gray-800">${formatTTL}</td></tr>
                <tr class="border-b border-gray-100"><td class="p-2 text-gray-400">Nilai Matematika</td><td class="p-2 font-bold text-blue-700">${globalDataSiswa.NilaiMatematika || '0.00'}</td></tr>
                <tr><td class="p-2 text-gray-400">Nilai B. Indonesia</td><td class="p-2 font-bold text-blue-700">${globalDataSiswa.NilaiBahasaIndo || '0.00'}</td></tr>
            `;
            document.getElementById('result-container').classList.remove('hidden');
        }

        // --- PEMBUATAN DOKUMEN HTKA (A4) DI TAB BARU ---
        function generateHTKADocument(data) {
            const tglCetak = getFormattedDateIndo();
            const printWindow = window.open("", "_blank");
            
            if (!printWindow) {
                showNotification(
                    "Pop-up Diblokir", 
                    "Harap izinkan jendela pop-up pada peramban Anda untuk melihat berkas Hasil TKA.", 
                    "⚠️"
                );
                return;
            }
            
            const formatNama = toTitleCase(data.NamaPeserta);
            const formatOrtu = toTitleCase(data.NamaOrangTua);
            const formatTTL = toTitleCase(data.TempatTanggalLahir);
            
            // Format judul PDF yang disarankan saat diunduh: "NIS Nama_Lengkap 2025-2026"
            const docTitle = `${data.NoIndukNIS || data.NoIndukNISN} ${formatNama} 2025-2026`;
            
            // HTML Dokumen Cetak A4 Resmi Tata Naskah Instansi Sekolah
            // Dioptimalkan agar pas 1 halaman penuh (single page) dengan box-sizing yang presisi dan pembatas margin ketat.
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>${docTitle}</title>
                    <script src="https://cdn.tailwindcss.com"></s` + `cript>
                    <link href="https://fonts.googleapis.com/css2?family=Times+New+Roman&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
                    <style>
                        body { 
                            font-family: 'Times New Roman', Times, serif; 
                            color: #1a1a1a;
                        }
                        @media print { 
                            .no-print { display: none !important; } 
                            body { background-color: white !important; margin: 0 !important; padding: 0 !important; } 
                            @page {
                                size: A4;
                                margin: 0 !important;
                            }
                            .print-container {
                                width: 210mm !important;
                                height: 297mm !important;
                                max-height: 297mm !important;
                                padding: 18mm 20mm 18mm 20mm !important;
                                margin: 0 !important;
                                border: none !important;
                                box-shadow: none !important;
                                box-sizing: border-box !important;
                                page-break-after: avoid !important;
                                page-break-before: avoid !important;
                                page-break-inside: avoid !important;
                            }
                        }
                    </style>
                </head>
                <body class="bg-gray-100 p-6 flex flex-col items-center">
                    
                    <!-- Tombol Pencetakan Melayang (Hanya untuk aksi di web, tidak ikut tercetak) -->
                    <div class="no-print mb-4 w-[210mm] flex justify-between items-center bg-blue-50 border border-blue-200 p-3 rounded-xl shadow-md font-sans">
                        <span class="text-xs text-blue-800 font-medium">📄 Dokumen ini adalah <b>Surat Keterangan Resmi</b> hasil TKA. Anda dapat mencetaknya langsung melalui tombol di sebelah kanan.</span>
                        <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2 px-5 rounded-lg shadow cursor-pointer transition-all flex items-center gap-2">
                            🖨️ Cetak Surat Resmi
                        </button>
                    </div>
                    
                    <!-- Kertas ukuran A4 standar (Sesuai Konfigurasi Cetak Sekolah) -->
                    <div class="print-container w-[210mm] min-h-[297mm] bg-white p-[20mm] shadow-lg border border-gray-200 flex flex-col justify-between relative">
                        
                        <div>
                            <!-- KOP SURAT RESMI SEKOLAH -->
                            <div class="flex items-center gap-6 pb-2 mb-4 kop-surat-ganda">
                                <!-- Logo Sekolah Gambar Asli Resmi SMP Diponegoro Sampang -->
                                <div class="w-20 h-20 flex-shrink-0">
                                    <img src="https://i.ibb.co.com/G4D06kBh/logodipo-trans.png" 
                                         alt="Logo SMP Diponegoro Sampang" 
                                         class="w-full h-full object-contain" 
                                         onerror="this.onerror=null; this.src='https://placehold.co/100x100?text=LOGO';">
                                </div>
                                
                                <div class="flex-grow text-center pr-12">

                                    <h1 class="text-2xl font-bold tracking-wide uppercase font-sans text-blue-900 leading-snug">SMP DIPONEGORO SAMPANG</h1>
                                    <p class="text-xs font-sans text-gray-600 mt-1">Status Terakreditasi B | NSS: 202030304013 | NPSN: 20300486</p>
                                    <p class="text-[10px] font-sans text-gray-500 mt-0.5">Alamat: Jl. Gerilya No. 70, Sampang, Cilacap, Jawa Tengah | Telp: (0282) 321554 | Kode Pos: 53273</p>
                                </div>
                            </div>
                            
                            <!-- JUDUL & NOMOR SURAT -->
                            <div class="text-center mb-6">
                                <h2 class="text-lg font-bold tracking-wide underline uppercase">SURAT KETERANGAN HASIL TES KEMAMPUAN AKADEMIK (HTKA)</h2>
                                <p class="text-sm font-sans text-gray-700 mt-1">Nomor: 421.3 / 118 / SMP-DP / V / 2026</p>
                            </div>
                            
                            <!-- PARAGRAF PEMBUKA -->
                            <p class="text-sm text-gray-800 mb-4 leading-relaxed text-justify">
                                Yang bertanda tangan di bawah ini, Kepala Sekolah SMP Diponegoro Sampang, Kabupaten Sampang, Provinsi Jawa Timur, menerangkan dengan sesungguhnya bahwa peserta didik yang tercantum di bawah ini:
                            </p>
                            
                            <!-- BIODATA BERSTRUKTUR TABEL RAPI -->
                            <div class="mb-5 pl-4">
                                <table class="text-sm text-gray-800 w-full">
                                    <tr class="h-6">
                                        <td class="w-48 font-semibold">Nama Lengkap</td>
                                        <td class="w-4 text-center">:</td>
                                        <td class="font-bold text-gray-900 uppercase">${formatNama}</td>
                                    </tr>
                                    <tr class="h-6">
                                        <td class="w-48 font-semibold">NIS</td>
                                        <td class="w-4 text-center">:</td>
                                        <td>${data.NoIndukNIS || '-'}</td>
                                    </tr>
                                    <tr class="h-6">
                                        <td class="w-48 font-semibold">NISN</td>
                                        <td class="w-4 text-center">:</td>
                                        <td class="font-bold">${data.NoIndukNISN || '-'}</td>
                                    </tr>
                                    <tr class="h-6">
